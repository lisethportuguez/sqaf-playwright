name: CI

# Path filters (ADR-0003, Stage 1): a change that touches ONLY documentation
# (docs/** or Markdown files) does not run the workflow, so the external SUT is
# not hit without need. `paths` is used instead of `paths-ignore` because only
# `paths` can re-include: code, configuration, tests, workflows and dependency
# manifests always trigger CI, even if they are Markdown files. Any file not
# excluded (e.g. .gitignore, LICENSE, metrics JSON) also triggers it.
# The two lists must stay identical. Manual runs (workflow_dispatch) are never
# filtered and always execute the full pipeline, baseline included.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '.github/workflows/**'
      - 'config/**'
      - 'src/**'
      - 'tests/**'
      - 'baseline/**'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '.github/workflows/**'
      - 'config/**'
      - 'src/**'
      - 'tests/**'
      - 'baseline/**'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  workflow_dispatch:

# Least privilege: the workflow reads the repository and, since Stage 6
# (ADR-0011), the artifacts of earlier runs of this workflow (actions: read)
# to download the Allure history. It never writes to the repository, never
# publishes GitHub Pages and never needs any other scope.
permissions:
  contents: read
  actions: read

# One run at a time per branch or pull request, and a running one is NEVER
# cancelled (Stage 4, E4.5): the authentication and checkout scenarios create
# test accounts, and a run cancelled half way could stop before their fixtures
# delete them. A newer push waits until the running run ends; if several
# pushes arrive meanwhile, GitHub keeps only the newest pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Typecheck, unit, baseline and integration (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Framework unit tests: no browser, no SUT. Includes the baseline contract.
      - name: Unit tests (framework)
        run: npm run test:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # workers = 1 and retries = 0 for the baseline come from playwright.config.ts
      - name: Run baseline
        run: |
          echo '## Baseline (Stage 0 conditions)' >> "$GITHUB_STEP_SUMMARY"
          npm run test:baseline

      # Baseline evidence (INC-2026-11-16): ONLY the failure classification
      # JSON is published (its excerpts are redacted). The baseline HTML report
      # is still generated but never uploaded: it records typed values, such
      # as the TC1 password, and it stays on the ephemeral runner.
      - name: Upload baseline classification
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-classification-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/failure-classification.json
          retention-days: 14
          if-no-files-found: error

      # Failure evidence (Stage 1) of the unit tests and the baseline: ONLY the
      # failure classification (redacted excerpts, classification, file and
      # line of each failed attempt). Raw test outputs (test-results/) are no
      # longer published (Stage 4, E4.5 final closure): their error contexts
      # and call logs show source code frames with fictitious e-mails and URL
      # credentials, and the baseline ones may contain the TC1 password
      # (INC-2026-11-16). The source is public, so file and line are enough.
      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/failure-classification.json
          retention-days: 14
          if-no-files-found: ignore

      # Stage 6 (ADR-0011): READ-ONLY download of the Allure history (trends)
      # from the latest completed push run on main that published one. Pull
      # requests read it too, but only push runs on main upload a new one
      # (step "Upload Allure history"). The history is scanned again with the
      # report before anything is published. Never fails the run: without a
      # history the report simply has no trends yet.
      - name: Download Allure history (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p allure-history
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status completed --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern 'allure-history-*' --dir allure-history-download > /dev/null 2>&1; then
              found=$(find allure-history-download -name history.jsonl | head -n 1)
              if [ -n "$found" ]; then cp "$found" allure-history/history.jsonl; echo "Allure history from run $id"; break; fi
            fi
          done
          rm -rf allure-history-download
          [ -f allure-history/history.jsonl ] || echo 'No Allure history yet: the report starts without trends.'

      # Stage 2 (ADR-0007): Page Objects and fixtures against the SUT, AFTER the
      # baseline so it can never influence the baseline run or its evidence.
      # Runs only if everything before it passed (fewer requests to the SUT).
      # Separate output folders and artifacts keep its results identifiable.
      # Stage 4 (E4.5, security closure): the CLI reporters replace the
      # configured ones, so NO HTML or raw JSON report is generated. The HTML
      # report showed the synthetic test-account e-mails in the `Fill "…"` step
      # titles (Playwright writes the typed value) and in the attachments; it
      # is no longer published. The run publishes only the safe summary.
      - name: Integration tests (Page Objects and fixtures)
        id: integration
        run: |
          echo '## Integration (Page Objects and fixtures)' >> "$GITHUB_STEP_SUMMARY"
          npm run test:integration -- --output=test-results-integration --reporter=list,./src/reporting/failure-classification-reporter.ts,./src/reporting/run-summary-reporter.ts,./src/reporting/allure-reporter.ts

      # Safe summary only (same reporter as the e2e step, uploaded BEFORE the
      # e2e step writes its own): outcome, attempts, durations and
      # classification per test; no error messages, step titles, attachments,
      # e-mails, account ids, passwords or card data.
      - name: Upload integration summary
        if: ${{ !cancelled() && steps.integration.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/run-summary.json
          retention-days: 14
          if-no-files-found: error

      # Failure evidence ONLY of the integration suites that never use test
      # accounts, e-mails, passwords or card data. Excluded: data/ (account API
      # and invalid logins), pages/auth, pages/checkout-components (card form),
      # reporting/ and security/ (fake-SUT runs with synthetic credentials),
      # and reports/ (its error excerpts may name a test account).
      - name: Upload integration failure evidence
        if: ${{ failure() && steps.integration.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results-integration/pages-base-page-*/
            test-results-integration/pages-cart-*/
            test-results-integration/pages-products-*/
            test-results-integration/pages-product-components-*/
            test-results-integration/fixtures-anti-bot-*/
            test-results-integration/fixtures-fixtures-*/
          retention-days: 14
          if-no-files-found: ignore

      # Stage 6 (ADR-0011): the SQAF Allure reporter (last in the list, after
      # the classification it reads) prepares SANITIZED results, scans them,
      # generates the report and scans it with the history, fail-closed. Here
      # it builds an integration-only report WITHOUT a history entry; the e2e
      # step rebuilds it with both suites and appends the single entry of the
      # run. Raw Allure results (allure-results/) never leave the runner.

      # Stage 4 (ADR-0010 D9, E4.5): the SQAF functional scenarios, AFTER the
      # integration tests and only if everything before passed.
      #  - pull_request: only @smoke (6 scenarios, 9 tests, 2 test accounts).
      #  - push to main and manual runs: the full suite (15 scenarios, 18 tests,
      #    8 test accounts).
      # Chromium (npm run test:e2e), 1 worker and the CI retries of
      # playwright.config.ts; flaky tests are reported as flaky, never hidden.
      # The CLI reporters replace the configured ones, so NO HTML or raw JSON
      # report is generated: they would hold the synthetic test-account
      # e-mails. The run publishes only the safe summary (and the job summary).
      - name: Functional scenarios (SQAF e2e)
        id: e2e
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then SELECTION='--grep=@smoke'; else SELECTION=''; fi
          echo "## Functional scenarios (SQAF e2e, ${SELECTION:-full suite})" >> "$GITHUB_STEP_SUMMARY"
          npm run test:e2e -- $SELECTION --output=test-results-e2e --reporter=list,./src/reporting/failure-classification-reporter.ts,./src/reporting/run-summary-reporter.ts,./src/reporting/allure-reporter.ts

      # Safe summary only: outcome, attempts, durations and classification per
      # test; no error messages, step titles, e-mails, passwords or card data.
      - name: Upload e2e summary
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/run-summary.json
          retention-days: 14
          if-no-files-found: error

      # Failure evidence ONLY of the product suites (tests/e2e/products), which
      # never use accounts or forms. Authentication and checkout outputs are
      # never published: their screenshots and error contexts show the
      # registration, login and payment forms (ADR-0009 D16).
      - name: Upload e2e failure evidence (product suites)
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results-e2e/products-*/
          retention-days: 14
          if-no-files-found: ignore

      # Stage 6 (ADR-0011): ONLY the scanned single-file HTML report. It exists
      # only if the pipeline found nothing: on any finding it is deleted. The
      # raw (allure-results/) and prepared (allure-results-safe/) results are
      # never published.
      - name: Upload Allure report
        if: ${{ !cancelled() && steps.integration.outcome != 'skipped' && hashFiles('allure-report/awesome/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-report/
          retention-days: 14
          if-no-files-found: error

      # The history is written ONLY by push runs on main (pull requests and
      # manual runs read it but never publish it), and only when the report
      # passed the scan (the history is scanned with it).
      - name: Upload Allure history
        if: ${{ !cancelled() && steps.integration.outcome != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('allure-report/awesome/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: allure-history/history.jsonl
          retention-days: 90
          if-no-files-found: error

      # Fail-closed: an unsafe or missing Allure report fails the run (after
      # the summaries and allowed evidence were uploaded), so a leak is never
      # silent. The status file holds detectors and file names, never values.
      - name: Check Allure pipeline
        if: ${{ !cancelled() && steps.integration.outcome != 'skipped' }}
        run: |
          test -f reports/allure-status.json || { echo '::error::The Allure pipeline did not run.'; exit 1; }
          cat reports/allure-status.json
          node -e "const s = require('./reports/allure-status.json'); if (!s.safe) { console.log('::error::Allure report blocked: ' + s.status); process.exit(1); }"
